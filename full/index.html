<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1a1210" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Commonplace" />
    <meta name="application-name" content="The Raconteur's Commonplace" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <title>The Raconteur’s Commonplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="world-home" id="world">
      <div class="scene-viewport" id="stage">
        <div class="scene-camera" id="scene-camera">
          <div class="room-3d" id="room">
            <div class="px-plane px-ceiling"></div>
            <div class="px-plane px-back" id="wall">
              <div class="px-arch"></div>
              <div class="unit-layer" id="unit-layer"></div>
            </div>
            <div class="px-plane px-floor"></div>
          </div>
        </div>
        <div class="scene-ambient"></div>
        <div class="scene-motes">
          <i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i>
        </div>
      </div>

      <div class="wordmark">
        <img class="brand-mark" src="./assets/rc-logo.png" width="110" height="84" alt="The Raconteur’s Commonplace" />
        <div class="wordmark-copy">
          <div class="wordmark-title">The Raconteur’s<br />Commonplace</div>
          <div class="wordmark-sub">a private archive of remembered places</div>
        </div>
      </div>

      <section class="search-shell" aria-label="Catalogue search">
        <div class="search-results" id="search-results" hidden>
          <div class="search-results-head">
            <p class="search-results-kicker">Catalogue</p>
            <button type="button" class="search-results-close" id="search-close" aria-label="Close search results">
              Close
            </button>
          </div>
          <p class="search-results-status" id="search-status">Type a title, author, or keyword.</p>
          <ul class="search-results-list" id="search-list"></ul>
        </div>

        <div class="search-bar">
          <div class="search-dock">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
            </svg>
            <input type="search" id="search" placeholder="Search the commonplace…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
            <button type="button" class="dock-button" id="btn-search">Search</button>
          </div>
          <a class="explore-button" id="btn-explore" href="../explore/">
            Explore
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path d="M9 18l6-6-6-6" />
            </svg>
          </a>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
    <script type="module" src="../pwa.js"></script>
  </body>
</html>
