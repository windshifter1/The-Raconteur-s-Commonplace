name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, kobo-plain]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-kobo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Supabase build env
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Provision Google Books API key
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$GOOGLE_BOOKS_API_KEY" ]; then
            echo "GOOGLE_BOOKS_API_KEY is not set yet — Open Library search still works."
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::GOOGLE_BOOKS_API_KEY is set but SUPABASE_ACCESS_TOKEN is missing; cannot push the key to the book-search function."
            exit 0
          fi
          npx --yes supabase secrets set GOOGLE_BOOKS_API_KEY="$GOOGLE_BOOKS_API_KEY" --project-ref joctuzargvajerqwxuvn
          npx --yes supabase functions deploy book-search --project-ref joctuzargvajerqwxuvn --no-verify-jwt
          url="$VITE_SUPABASE_URL"
          key="$VITE_SUPABASE_ANON_KEY"
          body=$(curl -sS -H "apikey: $key" -H "Authorization: Bearer $key" -H "Accept: application/json" \
            "${url%/}/functions/v1/book-search?q=test&limit=1")
          echo "$body" | head -c 300
          echo
          echo "$body" | grep -q '"googleConfigured":true' || {
            echo "::error::GOOGLE_BOOKS_API_KEY was set but book-search still reports googleConfigured=false."
            exit 1
          }

      - name: Build catalogue + Full Experience
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kobo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
