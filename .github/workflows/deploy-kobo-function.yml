name: Deploy Kobo catalogue Edge Function

on:
  push:
    branches: [main, kobo-plain]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-kobo-function.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy catalogue function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret not set."
            echo "Create a token: https://supabase.com/dashboard/account/tokens"
            echo "Add it as repo secret SUPABASE_ACCESS_TOKEN, then re-run."
            exit 0
          fi
          supabase functions deploy catalogue \
            --project-ref joctuzargvajerqwxuvn \
            --no-verify-jwt
