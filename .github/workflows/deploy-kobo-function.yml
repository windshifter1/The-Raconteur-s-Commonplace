name: Deploy Kobo catalogue Edge Function

on:
  push:
    branches: [main, kobo-plain]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-kobo-function.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SUPABASE_ACCESS_TOKEN is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is missing or empty."
            echo "GitHub → Settings → Secrets and variables → Actions → Repository secrets"
            echo "Name must be exactly: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          echo "Token present (length ${#SUPABASE_ACCESS_TOKEN})."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy catalogue + book-search functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          OPEN_LIBRARY_CONTACT_EMAIL: ${{ secrets.OPEN_LIBRARY_CONTACT_EMAIL }}
        run: |
          if [ -n "$GOOGLE_BOOKS_API_KEY" ]; then
            supabase secrets set GOOGLE_BOOKS_API_KEY="$GOOGLE_BOOKS_API_KEY" \
              --project-ref joctuzargvajerqwxuvn
          else
            echo "GOOGLE_BOOKS_API_KEY is not set yet — Google Books results will be skipped."
          fi
          if [ -n "$OPEN_LIBRARY_CONTACT_EMAIL" ]; then
            supabase secrets set OPEN_LIBRARY_CONTACT_EMAIL="$OPEN_LIBRARY_CONTACT_EMAIL" \
              --project-ref joctuzargvajerqwxuvn
          else
            echo "OPEN_LIBRARY_CONTACT_EMAIL secret unset — book-search uses the built-in contact User-Agent."
          fi
          supabase functions deploy catalogue \
            --project-ref joctuzargvajerqwxuvn \
            --no-verify-jwt
          supabase functions deploy book-search \
            --project-ref joctuzargvajerqwxuvn \
            --no-verify-jwt

      - name: Verify book-search + Google Books key
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Skipping book-search verify — missing Supabase URL/key vars."
            exit 0
          fi
          url="${VITE_SUPABASE_URL%/}/functions/v1/book-search?q=harry%20potter&limit=2"
          echo "Probing GET $url"
          body=$(curl -sS -w "\nHTTP:%{http_code}" \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${VITE_SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "$url")
          echo "$body" | tail -c 400
          echo "$body" | grep -q 'HTTP:200' || { echo "::error::book-search did not return 200."; exit 1; }
          echo "$body" | grep -q '"results"' || { echo "::error::book-search JSON missing results."; exit 1; }
          if [ -n "$GOOGLE_BOOKS_API_KEY" ]; then
            echo "$body" | grep -q '"googleConfigured":true' || {
              echo "::error::GOOGLE_BOOKS_API_KEY is in GitHub secrets but the Edge Function still reports it missing."
              exit 1
            }
            echo "Google Books key is live on book-search."
          else
            echo "GOOGLE_BOOKS_API_KEY still empty in this job's secrets — Open Library only."
          fi

      - name: Verify function responds
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Skipping live verify — missing Supabase URL/key vars."
            exit 0
          fi
          # Supabase cannot serve HTML on GET — probe with POST.
          url="${VITE_SUPABASE_URL%/}/functions/v1/catalogue?apikey=${VITE_SUPABASE_ANON_KEY}"
          echo "Probing POST $url"
          status=$(curl -s -o /tmp/catalogue.html -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "action=view&view=home" \
            "$url")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Function probe failed."
            head -c 400 /tmp/catalogue.html || true
            exit 1
          fi
          if ! grep -q "Find a Book" /tmp/catalogue.html; then
            echo "::error::Function returned 200 but home page looks wrong."
            exit 1
          fi
          echo "Live catalogue verified."
