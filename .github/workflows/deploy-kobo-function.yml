name: Deploy Kobo catalogue Edge Function

on:
  push:
    branches: [main, kobo-plain]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-kobo-function.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SUPABASE_ACCESS_TOKEN is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is missing or empty."
            echo "GitHub → Settings → Secrets and variables → Actions → Repository secrets"
            echo "Name must be exactly: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          echo "Token present (length ${#SUPABASE_ACCESS_TOKEN})."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy catalogue function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy catalogue \
            --project-ref joctuzargvajerqwxuvn \
            --no-verify-jwt

      - name: Verify function responds
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Skipping live verify — missing Supabase URL/key vars."
            exit 0
          fi
          url="${VITE_SUPABASE_URL%/}/functions/v1/catalogue?apikey=${VITE_SUPABASE_ANON_KEY}&view=catalogue"
          echo "Probing $url"
          status=$(curl -s -o /tmp/catalogue.html -w "%{http_code}" "$url")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Function probe failed."
            head -c 400 /tmp/catalogue.html || true
            exit 1
          fi
          if ! grep -q "Raconteur" /tmp/catalogue.html; then
            echo "::error::Function returned 200 but HTML looks wrong."
            exit 1
          fi
          echo "Live catalogue verified."
