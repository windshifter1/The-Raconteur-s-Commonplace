      <path d="M3 0 C7 10, 5 20, 9 30 S7 40, 7 40" stroke="#9A6D42" stroke-width="0.9" fill="none" opacity="0.3"/>
      <path d="M15 0 C12 12, 17 22, 14 34 S17 40, 17 40" stroke="#D2A878" stroke-width="0.8" fill="none" opacity="0.22"/>
    </pattern>
  </defs>

