    <g>
      <rect x="564" y="92" width="72" height="608" fill="url(#grain)" stroke="#9A6D42" stroke-width="1"/>
      <rect x="572" y="100" width="56" height="100" fill="#EDE0CF"/>
      <rect x="572" y="208" width="56" height="100" fill="#EDE0CF"/>
      <rect x="572" y="316" width="56" height="100" fill="#EDE0CF"/>
      <rect x="572" y="424" width="56" height="100" fill="#EDE0CF"/>
