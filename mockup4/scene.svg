      <rect x="644" y="648" width="50" height="44" fill="#B8895A" stroke="#8A6238" stroke-width="1"/>
      <rect x="698" y="648" width="50" height="44" fill="#A67848" stroke="#8A6238" stroke-width="1"/>
      <rect x="752" y="648" width="50" height="44" fill="#B8895A" stroke="#8A6238" stroke-width="1"/>
      <rect x="806" y="648" width="54" height="44" fill="#A67848" stroke="#8A6238" stroke-width="1"/>
