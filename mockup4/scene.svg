<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Vector twin: stepped warm-wood bookshelf between curtained windows">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F3F1EC"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D19A66"/>
      <stop offset="100%" stop-color="#B87B48"/>
    </linearGradient>
    <linearGradient id="woodFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A06C"/>
      <stop offset="50%" stop-color="#B8895A"/>
      <stop offset="100%" stop-color="#A67848"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
